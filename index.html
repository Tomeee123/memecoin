<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MemeBot">
<title>MemeBot (Paper)</title>
<style>
  :root { --bg:#12141a; --panel:#1c1f29; --fg:#e6e8ee; --dim:#8b90a0; --green:#2ecc71; --red:#e74c3c; --amber:#f5a623; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,sans-serif; }
  body { padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 20px); max-width:560px; margin:0 auto; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .badge { font-size:12px; font-weight:700; }
  #btn { width:100%; margin:12px 0; padding:20px; font-size:28px; font-weight:800; color:#fff; background:var(--green); border:0; border-radius:14px; }
  #btn.running { background:var(--red); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card { background:var(--panel); border-radius:12px; padding:12px; }
  .card .t { font-size:12px; color:var(--dim); }
  .card .v { font-size:20px; font-weight:700; margin-top:4px; }
  .tabs { display:flex; gap:6px; margin:14px 0 10px; }
  .tabs button { flex:1; padding:9px; background:var(--panel); color:var(--dim); border:0; border-radius:8px; font-size:14px; }
  .tabs button.on { background:#2a2f3f; color:var(--fg); font-weight:700; }
  .list { background:var(--panel); border-radius:12px; padding:12px; min-height:120px; }
  .log { font:12px ui-monospace,Menlo,monospace; margin:3px 0; word-break:break-word; }
  .item { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #262a38; font-size:14px; }
  .item:last-child { border-bottom:0; }
  .sub { font-size:12px; color:var(--dim); }
  .pos { color:var(--green); } .neg { color:var(--red); }
  label { font-size:13px; color:var(--dim); display:flex; gap:8px; align-items:center; margin-top:14px; }
  .reset { margin-top:16px; background:none; border:0; color:var(--red); font-size:13px; }
  .note { font-size:12px; color:var(--dim); margin-top:10px; line-height:1.4; }
</style>
</head>
<body>
  <div class="row">
    <span class="badge" style="color:var(--amber)">PAPER MODE - no real money</span>
    <span class="badge" id="status" style="color:var(--red)">STOPPED</span>
  </div>

  <button id="btn">START</button>

  <div class="grid">
    <div class="card"><div class="t">Cash</div><div class="v" id="s-cash">-</div></div>
    <div class="card"><div class="t">Open positions</div><div class="v" id="s-open">-</div></div>
    <div class="card"><div class="t">Today PnL</div><div class="v" id="s-day">-</div></div>
    <div class="card"><div class="t">Total PnL</div><div class="v" id="s-total">-</div></div>
    <div class="card"><div class="t">Sells</div><div class="v" id="s-sells">-</div></div>
    <div class="card"><div class="t">Win rate</div><div class="v" id="s-wr">-</div></div>
  </div>

  <div class="tabs">
    <button data-tab="log" class="on">Log</button>
    <button data-tab="trades">Trades</button>
    <button data-tab="open">Open</button>
  </div>
  <div class="list" id="list"></div>

  <label><input type="checkbox" id="rugReq" checked> Require RugCheck (skip tokens if it cannot be reached)</label>
  <div class="note">Keep this page open with the screen on. iOS pauses web pages when you lock the phone or switch apps. The bot trades with simulated money only.</div>
  <button class="reset" id="reset">Reset paper account</button>

<script>
// ======================= CONFIG (edit these numbers) =======================
const CFG = {
  startBalance: 1000, positionSize: 25, maxOpen: 5, dailyLossLimit: 75,
  minLiquidity: 15000, minVolumeM5: 2000, minAgeMin: 5, maxAgeMin: 240,
  minBuySellRatio: 1.2, minTxnsM5: 20, maxFDV: 5000000,
  stopLossPct: -35, tp1Pct: 100, tp1Fraction: 0.5, tp2Pct: 300, tp2Fraction: 0.25,
  trailingStopPct: 30, maxHoldMin: 180, rugLiqDrop: 0.3,
  slippagePct: 3, feePct: 1,
  scanInterval: 30, monitorInterval: 15
};
const COST = CFG.slippagePct + CFG.feePct;
const KEY = 'memebot_state_v1';

// ============================== STATE ======================================
let S = loadState();
let running = false, wakeLock = null, loopTimer = null, tab = 'log', logs = [], lastScan = 0;

function freshState() {
  return { balance: CFG.startBalance, positions: {}, trades: [], seen: [], day: '', dayPnl: 0, requireRug: true };
}
function loadState() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(freshState(), JSON.parse(raw)); } catch (e) {}
  return freshState();
}
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function log(msg) {
  const d = new Date(); const p = n => String(n).padStart(2, '0');
  logs.unshift(p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '  ' + msg);
  if (logs.length > 200) logs.pop();
}

// ============================== NETWORK ====================================
async function getJSON(url) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 15000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
  finally { clearTimeout(t); }
}

async function discover() {
  const paths = ['token-profiles/latest/v1', 'token-boosts/latest/v1'];
  const out = []; let anyOk = false;
  for (const p of paths) {
    const data = await getJSON('https://api.dexscreener.com/' + p);
    if (Array.isArray(data)) {
      anyOk = true;
      for (const d of data) if (d.chainId === 'solana' && d.tokenAddress) out.push(d.tokenAddress);
    }
  }
  if (!anyOk) return null;
  return [...new Set(out)];
}

// best (highest-liquidity) pair per mint; null if any request failed
async function fetchPairs(mints) {
  const best = {};
  for (let i = 0; i < mints.length; i += 30) {
    const chunk = mints.slice(i, i + 30);
    const data = await getJSON('https://api.dexscreener.com/tokens/v1/solana/' + chunk.join(','));
    if (!Array.isArray(data)) return null;
    for (const p of data) {
      const addr = p.baseToken && p.baseToken.address;
      if (!addr) continue;
      if (!best[addr] || liq(p) > liq(best[addr])) best[addr] = p;
    }
  }
  return best;
}
const liq = p => (p.liquidity && p.liquidity.usd) || 0;

async function rugcheck(mint) {
  const d = await getJSON('https://api.rugcheck.xyz/v1/tokens/' + mint + '/report/summary');
  if (!d) return { ok: false, unreachable: true, why: 'rugcheck unreachable' };
  const dangers = (d.risks || []).filter(r => r.level === 'danger').map(r => r.name);
  if (dangers.length) return { ok: false, why: 'danger: ' + dangers.slice(0, 3).join(', ') };
  return { ok: true };
}

// ============================== ENTRY ======================================
function filterReason(p) {
  const price = parseFloat(p.priceUsd);
  if (!p.pairCreatedAt || !price) return 'missing';
  const age = (Date.now() - p.pairCreatedAt) / 60000;
  const vol5 = (p.volume && p.volume.m5) || 0;
  const tx = (p.txns && p.txns.m5) || { buys: 0, sells: 0 };
  if (liq(p) < CFG.minLiquidity) return 'liq';
  if (vol5 < CFG.minVolumeM5) return 'vol';
  if (age < CFG.minAgeMin || age > CFG.maxAgeMin) return 'age';
  if (tx.buys + tx.sells < CFG.minTxnsM5) return 'txns';
  if (tx.buys / Math.max(tx.sells, 1) < CFG.minBuySellRatio) return 'ratio';
  if (p.fdv && p.fdv > CFG.maxFDV) return 'fdv';
  return null;
}

function openPosition(p) {
  const mint = p.baseToken.address, sym = p.baseToken.symbol || '?';
  const price = parseFloat(p.priceUsd);
  const fill = price * (1 + COST / 100);
  S.balance -= CFG.positionSize;
  S.positions[mint] = { mint, symbol: sym, entryPrice: fill, sizeUsd: CFG.positionSize, remaining: 1,
    entryLiq: liq(p), openedAt: Date.now(), peakPrice: price, tp1Done: false, tp2Done: false };
  S.trades.unshift({ t: Date.now(), symbol: sym, action: 'BUY', usd: CFG.positionSize, pnl: 0, reason: 'signal' });
  log('BUY ' + sym + ' @ ' + fill.toPrecision(4));
}

async function scan() {
  const today = new Date().toISOString().slice(0, 10);
  if (S.day !== today) { S.day = today; S.dayPnl = 0; }
  if (S.dayPnl <= -CFG.dailyLossLimit) { log('Daily loss limit hit: no new entries today.'); return; }
  if (Object.keys(S.positions).length >= CFG.maxOpen || S.balance < CFG.positionSize) return;

  const all = await discover();
  if (all === null) { log('Cannot reach DexScreener (network or browser block).'); return; }
  const fresh = all.filter(m => !S.seen.includes(m) && !S.positions[m]);
  if (!fresh.length) return;
  const pairs = await fetchPairs(fresh);
  if (!pairs) return;

  for (const mint of fresh) {
    const p = pairs[mint];
    if (!p) continue;
    const why = filterReason(p);
    if (why) { if (why === 'age' || why === 'fdv') S.seen.push(mint); continue; }

    const sym = p.baseToken.symbol || '?';
    const rc = await rugcheck(mint);
    if (!rc.ok) {
      if (rc.unreachable) {
        if (S.requireRug) { log('RugCheck unreachable: skipping entries this scan.'); return; }
        log('WARNING ' + sym + ': entered WITHOUT RugCheck.');
      } else {
        S.seen.push(mint); log('SKIP ' + sym + ': ' + rc.why); continue;
      }
    }
    S.seen.push(mint);
    openPosition(p);
    if (Object.keys(S.positions).length >= CFG.maxOpen || S.balance < CFG.positionSize) break;
  }
  if (S.seen.length > 2000) S.seen = S.seen.slice(-2000);
}

// ============================== EXITS ======================================
function sell(mint, frac, price, reason, haircut = 0) {
  const pos = S.positions[mint]; if (!pos) return;
  const f = Math.min(frac, pos.remaining);
  const fill = price * (1 - COST / 100) * (1 - haircut);
  const proceeds = pos.sizeUsd * f * (fill / pos.entryPrice);
  const pnl = proceeds - pos.sizeUsd * f;
  pos.remaining -= f; S.balance += proceeds; S.dayPnl += pnl;
  S.trades.unshift({ t: Date.now(), symbol: pos.symbol, action: 'SELL', usd: proceeds, pnl, reason });
  if (S.trades.length > 1000) S.trades.pop();
  log('SELL ' + pos.symbol + ' ' + Math.round(f * 100) + '% pnl ' + (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + ' [' + reason + ']');
  if (pos.remaining <= 1e-9) delete S.positions[mint];
}

async function monitor() {
  const mints = Object.keys(S.positions);
  if (!mints.length) return;
  const pairs = await fetchPairs(mints);
  if (!pairs) return; // network failure: do NOT treat as rug

  for (const mint of mints) {
    const pos = S.positions[mint]; if (!pos) continue;
    const held = (Date.now() - pos.openedAt) / 60000;
    const p = pairs[mint]; const price = p ? parseFloat(p.priceUsd) : NaN;
    if (!p || !price) {
      if (held > 2) sell(mint, pos.remaining, 1e-7, 'pair gone (rug?)');
      continue;
    }
    pos.peakPrice = Math.max(pos.peakPrice, price);
    const screenEntry = pos.entryPrice / (1 + COST / 100);
    const pnlPct = (price / screenEntry - 1) * 100;

    if (liq(p) < pos.entryLiq * CFG.rugLiqDrop) {
      sell(mint, pos.remaining, price, 'liquidity collapse', 0.5);
    } else if (pnlPct <= CFG.stopLossPct) {
      sell(mint, pos.remaining, price, 'stop-loss ' + Math.round(pnlPct) + '%');
    } else {
      if (!pos.tp1Done && pnlPct >= CFG.tp1Pct) { sell(mint, CFG.tp1Fraction, price, 'TP1'); pos.tp1Done = true; }
      if (S.positions[mint] && !pos.tp2Done && pnlPct >= CFG.tp2Pct) { sell(mint, CFG.tp2Fraction, price, 'TP2'); pos.tp2Done = true; }
      if (S.positions[mint] && pos.tp1Done) {
        const drop = (price / pos.peakPrice - 1) * 100;
        if (drop <= -CFG.trailingStopPct) sell(mint, pos.remaining, price, 'trailing stop');
      }
      if (S.positions[mint] && held >= CFG.maxHoldMin) sell(mint, pos.remaining, price, 'time stop');
    }
  }
}

// ============================== LOOP / CONTROL =============================
async function tick() {
  if (!running) return;
  try {
    if (Date.now() - lastScan >= CFG.scanInterval * 1000) { await scan(); lastScan = Date.now(); }
    await monitor();
    saveState();
  } catch (e) { log('[error] ' + e.message); }
  render();
  if (running) loopTimer = setTimeout(tick, CFG.monitorInterval * 1000);
}

async function lockScreen() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function start() { running = true; lastScan = 0; log('Bot started. Keep this page open.'); lockScreen(); tick(); render(); }
function stop() {
  running = false; clearTimeout(loopTimer);
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  log('Bot stopped.'); saveState(); render();
}
document.addEventListener('visibilitychange', () => {
  if (!running) return;
  if (document.visibilityState === 'visible') { lockScreen(); log('Back in foreground, resuming.'); tick(); }
  else log('Page hidden: iOS pauses the bot until you return.');
});

// ============================== UI =========================================
const $ = id => document.getElementById(id);
const money = v => '$' + v.toFixed(2);
const signed = v => (v >= 0 ? '+' : '-') + '$' + Math.abs(v).toFixed(2);
const cls = v => (v >= 0 ? 'pos' : 'neg');

function setStat(id, text, c) { const el = $(id); el.textContent = text; el.className = 'v ' + (c || ''); }

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;   // textContent: token names are untrusted
  return e;
}

function render() {
  const sells = S.trades.filter(t => t.action === 'SELL');
  const total = sells.reduce((a, t) => a + t.pnl, 0);
  const wr = sells.length ? sells.filter(t => t.pnl > 0).length / sells.length * 100 : 0;
  setStat('s-cash', money(S.balance));
  setStat('s-open', Object.keys(S.positions).length + ' / ' + CFG.maxOpen);
  setStat('s-day', signed(S.dayPnl), cls(S.dayPnl));
  setStat('s-total', signed(total), cls(total));
  setStat('s-sells', String(sells.length));
  setStat('s-wr', Math.round(wr) + '%');

  $('status').textContent = running ? 'RUNNING' : 'STOPPED';
  $('status').style.color = running ? 'var(--green)' : 'var(--red)';
  $('btn').textContent = running ? 'STOP' : 'START';
  $('btn').className = running ? 'running' : '';

  const list = $('list'); list.replaceChildren();
  if (tab === 'log') {
    if (!logs.length) list.appendChild(el('div', 'sub', 'Ready. Tap START.'));
    logs.forEach(l => list.appendChild(el('div', 'log', l)));
  } else if (tab === 'trades') {
    if (!S.trades.length) list.appendChild(el('div', 'sub', 'No trades yet.'));
    S.trades.slice(0, 100).forEach(t => {
      const row = el('div', 'item'); const left = el('div');
      left.appendChild(el('div', '', t.action + ' ' + t.symbol));
      left.appendChild(el('div', 'sub', t.reason));
      row.appendChild(left);
      row.appendChild(t.action === 'SELL' ? el('div', cls(t.pnl), signed(t.pnl)) : el('div', 'sub', money(t.usd)));
      list.appendChild(row);
    });
  } else {
    const ps = Object.values(S.positions);
    if (!ps.length) list.appendChild(el('div', 'sub', 'No open positions.'));
    ps.forEach(p => {
      const row = el('div', 'item');
      row.appendChild(el('div', '', p.symbol));
      row.appendChild(el('div', 'sub', Math.round(p.remaining * 100) + '% left' + (p.tp1Done ? ' - TP1 hit' : '')));
      list.appendChild(row);
    });
  }
}

$('btn').onclick = () => (running ? stop() : start());
$('rugReq').checked = S.requireRug;
$('rugReq').onchange = e => { S.requireRug = e.target.checked; saveState(); };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('reset').onclick = () => {
  if (!confirm('Erase all paper trades and reset to $1000?')) return;
  stop(); S = freshState(); logs = []; saveState(); render();
};
render();
</script>
</body>
</html>
